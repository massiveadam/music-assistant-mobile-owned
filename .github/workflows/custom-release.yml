name: Build & Release Custom APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Check immutable release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' androidApp/build.gradle.kts)
          test -n "$VERSION"
          TAG="v$VERSION"
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then
            echo "Tag and Android source version disagree." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          RELEASE_TAGS=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name')
          if printf '%s\n' "$RELEASE_TAGS" | grep -Fxq -- "$TAG"; then
            target=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .target_commitish)
            test "$target" = "$GITHUB_SHA" || { echo "This version belongs to a different source commit." >&2; exit 1; }
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets | map(.name) | contains(["Music-Assistant-Owned.apk", "Music-Assistant-Owned.apk.sha256"])' | grep -Fx true
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "The local publisher already delivered this source version. Retaining its immutable assets."
          fi

      # Sign with the same keystore the currently installed app already trusts,
      # so CI-built releases install as updates over existing installs. The
      # selfSignedRelease variant reads ~/.android/debug.keystore, matching the
      # local deploy-update.sh pipeline.
      - name: Install signing keystore
        if: steps.version.outputs.exists != 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$HOME/.android/debug.keystore"
          test -s "$HOME/.android/debug.keystore"

      - name: Verify native feature paths
        if: steps.version.outputs.exists != 'true'
        run: ./gradlew :androidApp:testDebugUnitTest --tests 'io.music_assistant.client.data.*' --tests 'io.music_assistant.client.feature.HomeTest' --tests '*ItemDetailsTest' --tests '*CategoryRowTest' --console=plain

      - name: Build signed Android APK
        if: steps.version.outputs.exists != 'true'
        run: ./gradlew :androidApp:assembleSelfSignedRelease --console=plain

      - name: Prepare Release Artifacts
        if: steps.version.outputs.exists != 'true'
        id: prepare
        run: |
          mkdir -p release-assets
          cp androidApp/build/outputs/apk/selfSignedRelease/androidApp-universal-selfSignedRelease.apk release-assets/Music-Assistant-Owned.apk
          cd release-assets
          sha256sum Music-Assistant-Owned.apk > Music-Assistant-Owned.apk.sha256
          echo "SHA=$(cut -d' ' -f1 < Music-Assistant-Owned.apk.sha256)" >> $GITHUB_OUTPUT

      # Print the signing certificate so the log shows which key produced the
      # artifact (should match the installed app's key).
      - name: Verify release signature
        if: steps.version.outputs.exists != 'true'
        run: |
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --print-certs release-assets/Music-Assistant-Owned.apk \
            | grep -i "certificate SHA-256 digest"

      - name: Create GitHub Release
        if: steps.version.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            release-assets/Music-Assistant-Owned.apk \
            release-assets/Music-Assistant-Owned.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" --generate-notes
