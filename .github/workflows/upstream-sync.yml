name: Sync from upstream

# Keeps this standalone repo from drifting away from the official client.
# Never auto-merges: it merges upstream into the `upstream-sync` branch and opens
# a PR into main. On a conflict it writes a run summary and fails so the merge can
# be resolved deliberately.

on:
  schedule:
    - cron: '0 7 * * 1' # Mondays 07:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream into the sync branch
        id: merge
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/music-assistant/mobile-app.git || true
          git fetch --quiet upstream main
          behind=$(git rev-list --count HEAD..upstream/main)
          echo "behind=$behind" >> "$GITHUB_OUTPUT"
          if [ "$behind" -eq 0 ]; then
            echo "result=current" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git checkout -B upstream-sync
          if git merge --no-edit upstream/main >/tmp/merge.log 2>&1; then
            echo "result=merged" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --diff-filter=U >/tmp/conflicts.txt || true
            git merge --abort || true
            echo "result=conflict" >> "$GITHUB_OUTPUT"
          fi

      - name: Push sync branch
        if: steps.merge.outputs.result == 'merged'
        run: git push --force origin upstream-sync

      - name: Open or update PR
        if: steps.merge.outputs.result == 'merged'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repo="${{ github.repository }}"
          if gh pr view upstream-sync >/dev/null 2>&1; then
            gh pr comment upstream-sync --body "Updated with the latest upstream commits." \
              || echo "::warning::Could not update the PR."
          else
            gh pr create --base main --head upstream-sync \
              --title "chore: sync with upstream music-assistant/mobile-app" \
              --body "Automated weekly merge of upstream into this branch. Review the diff before merging; this PR is never auto-merged." \
              || echo "::warning::Could not open the PR automatically (enable 'Allow GitHub Actions to create and approve pull requests' in repo settings, or open it from the upstream-sync branch)."
          fi
          {
            echo "### Upstream sync"
            echo
            echo "Merged upstream \`music-assistant/mobile-app\` into the \`upstream-sync\` branch (was ${{ steps.merge.outputs.behind }} commits behind)."
            echo
            echo "Compare / open PR: https://github.com/$repo/compare/main...upstream-sync?expand=1"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report conflict
        if: steps.merge.outputs.result == 'conflict'
        run: |
          {
            echo "### Upstream sync conflict"
            echo
            echo "Merging \`music-assistant/mobile-app\` into \`main\` conflicted in:"
            echo
            echo '```'
            cat /tmp/conflicts.txt
            echo '```'
            echo
            echo "Resolve locally:"
            echo '```'
            echo "git fetch origin && git checkout custom/retheme && git merge origin/main"
            echo "git remote add upstream https://github.com/music-assistant/mobile-app.git  # once"
            echo "git fetch upstream main && git merge upstream/main"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Upstream merge conflicted; see the run summary for the file list."
          exit 1

      - name: Already current
        if: steps.merge.outputs.result == 'current'
        run: echo "Up to date with upstream; nothing to do." >> "$GITHUB_STEP_SUMMARY"
