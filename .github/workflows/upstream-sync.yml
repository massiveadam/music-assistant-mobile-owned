name: Sync from upstream

# Keeps this standalone repo from drifting away from the official client.
# It never auto-merges: on a clean merge it opens/updates a PR into main, and on
# a conflict it files an issue so the merge can be resolved deliberately.

on:
  schedule:
    - cron: '0 7 * * 1' # Mondays 07:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream into a sync branch
        id: merge
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/music-assistant/mobile-app.git || true
          git fetch --quiet upstream main
          behind=$(git rev-list --count HEAD..upstream/main)
          echo "behind=$behind" >> "$GITHUB_OUTPUT"
          if [ "$behind" -eq 0 ]; then
            echo "result=current" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git checkout -B upstream-sync
          if git merge --no-edit upstream/main >/tmp/merge.log 2>&1; then
            echo "result=merged" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --diff-filter=U >/tmp/conflicts.txt || true
            git merge --abort || true
            echo "result=conflict" >> "$GITHUB_OUTPUT"
          fi

      - name: Push sync branch and open PR
        if: steps.merge.outputs.result == 'merged'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push --force origin upstream-sync
          if gh pr view upstream-sync --json number >/dev/null 2>&1; then
            gh pr comment upstream-sync --body "Updated: merged the latest upstream commits (was ${{ steps.merge.outputs.behind }} behind at the start of this run)."
          else
            gh pr create --base main --head upstream-sync \
              --title "chore: sync with upstream music-assistant/mobile-app" \
              --body "Automated weekly merge of upstream. Review the diff and resolve any behavior changes before merging; this PR is never auto-merged."
          fi

      - name: Report conflict
        if: steps.merge.outputs.result == 'conflict'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Upstream sync needs a manual merge"
          {
            echo "Merging upstream \`music-assistant/mobile-app\` into \`main\` conflicted in these files:"
            echo
            echo '```'
            cat /tmp/conflicts.txt
            echo '```'
            echo
            echo "Resolve locally:"
            echo '```'
            echo "git fetch origin && git checkout custom/retheme && git merge origin/main"
            echo "git remote add upstream https://github.com/music-assistant/mobile-app.git  # once"
            echo "git fetch upstream main && git merge upstream/main"
            echo '```'
          } > /tmp/issue_body.md
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still conflicting as of $(date -u +%Y-%m-%d)."
          else
            gh issue create --title "$title" --body-file /tmp/issue_body.md
          fi

      - name: Already current
        if: steps.merge.outputs.result == 'current'
        run: echo "Up to date with upstream; nothing to do."
